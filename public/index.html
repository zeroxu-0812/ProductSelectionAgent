<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选品 Agent 工作台</title>
<style>
:root {
  --bg: #0d1117; --card: #161b22; --border: #30363d;
  --txt: #e6edf3; --sub: #8b949e; --accent: #58a6ff;
  --ok: #3fb950; --warn: #d29922; --err: #f85149; --susp: #a371f7;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--txt);
  font-family: -apple-system, "PingFang SC", sans-serif; padding: 20px; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 16px 20px;
  background: linear-gradient(135deg, #1f2a3a 0%, #161b22 100%);
  border: 1px solid var(--border); border-radius: 14px; margin-bottom: 20px; }
.topbar h1 { font-size: 20px; }
.topbar .sub { color: var(--sub); font-size: 13px; }
.topbar .health { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }
.dot.off { background: var(--err); }
.grid { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px; }
.panel h2 { font-size: 15px; margin-bottom: 14px; color: var(--accent); }
.task-card { border: 1px solid var(--border); border-left: 4px solid var(--sub);
  border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
  transition: all .15s; background: #0d1117; }
.task-card:hover { border-color: var(--accent); }
.task-card .row1 { display: flex; align-items: center; gap: 8px; }
.task-card .type { font-weight: 600; font-size: 14px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; margin-left: auto; }
.badge.suspended { background: #2d2438; color: var(--susp); border: 1px solid var(--susp); }
.badge.success { background: #14281b; color: var(--ok); border: 1px solid var(--ok); }
.badge.error, .badge.failed { background: #2d1517; color: var(--err); border: 1px solid var(--err); }
.badge.pending, .badge.starting { background: #241f12; color: var(--warn); border: 1px solid var(--warn); }
.task-card .row2 { font-size: 12px; color: var(--sub); margin-top: 6px; }
.task-card.active { border-color: var(--accent); border-left-width: 5px; }
#detail .steps { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border-radius: 8px; background: #0d1117; border: 1px solid var(--border); font-size: 13px; }
.step .sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--sub); }
.step.success .sdot { background: var(--ok); }
.step.suspended .sdot { background: var(--susp); box-shadow: 0 0 8px var(--susp); }
.step.error .sdot { background: var(--err); }
.step .sname { font-weight: 600; }
.step .sstatus { margin-left: auto; font-size: 11px; color: var(--sub); }
.cardbox { margin-top: 16px; border: 1px solid var(--susp); border-radius: 12px;
  background: #1a1428; padding: 16px; }
.cardbox .ctitle { font-size: 15px; font-weight: 700; color: var(--susp); margin-bottom: 10px; }
.cardbox .cdetail { font-size: 13px; color: var(--sub); line-height: 1.6; margin-bottom: 14px;
  white-space: pre-wrap; }
.cardbox .opts { display: flex; flex-direction: column; gap: 8px; }
.optbtn { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border);
  background: #0d1117; color: var(--txt); cursor: pointer; text-align: left; font-size: 13px; }
.optbtn:hover { border-color: var(--susp); background: #221b33; }
.optbtn.primary { border-color: var(--susp); color: #d2a8ff; }
form.newtask { display: flex; flex-direction: column; gap: 10px; }
form.newtask select, form.newtask input, form.newtask textarea {
  background: #0d1117; border: 1px solid var(--border); color: var(--txt);
  border-radius: 8px; padding: 9px 12px; font-size: 13px; }
form.newtask button { padding: 10px; border-radius: 8px; background: var(--accent);
  border: none; color: #0d1117; font-weight: 700; cursor: pointer; font-size: 14px; }
.report-frame { width: 100%; height: 78vh; border: 1px solid var(--border);
  border-radius: 12px; background: #fff; }
.empty { color: var(--sub); font-size: 13px; text-align: center; padding: 30px 0; }
.plog { margin-top: 14px; border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; background: #0d1117; }
.plog h3 { font-size: 12px; color: var(--sub); margin-bottom: 8px; }
.pline { font-family: ui-monospace, monospace; font-size: 11px; color: #9da9b5;
  line-height: 1.7; white-space: pre-wrap; word-break: break-all; }
.preset { display: flex; gap: 6px; flex-wrap: wrap; }
.preset button { font-size: 12px; padding: 5px 10px; border-radius: 14px;
  border: 1px solid var(--border); background: #0d1117; color: var(--sub); cursor: pointer; }
.preset button.on { border-color: var(--accent); color: var(--accent); }
#reports-tab { display: none; }
</style>
</head>
<body>
<div class="topbar">
  <h1>🛠️ 选品 Agent 工作台</h1>
  <span class="sub">五智能体集群 · HITL 人在环 · Mastra 编排</span>
  <div class="health"><span class="dot" id="hdot"></span><span id="htext" class="sub">检查中…</span></div>
</div>

<div class="grid">
  <div class="panel">
    <h2>新建任务</h2>
    <form class="newtask" id="newtask">
      <select id="f-type">
        <option value="refresh">refresh — 全流程（打标+洞察）</option>
        <option value="monitorKeywords">监控 — Sif 关键词巡检</option>
        <option value="collect">取数 — 三源采集</option>
        <option value="insight">洞察 — 报告生成</option>
        <option value="tag">打标 — 打标增量</option>
      </select>
      <div class="preset" id="preset"></div>
      <textarea id="f-params" rows="9" placeholder='{"category":"square_nose", ...} 参数 JSON'></textarea>
      <button type="submit">🚀 启动任务</button>
    </form>
    <h2 style="margin-top:20px">任务列表</h2>
    <div id="tasks"></div>
  </div>

  <div class="panel" id="detail">
    <h2 id="detail-title">任务详情</h2>
    <div class="empty">← 选择左侧任务查看</div>
    <div id="steps-box"></div>
    <div id="card-box"></div>
    <div id="report-box"></div>
  </div>
</div>

<script>
const API = "";
let curTask = null;
let timer = null;

const TYPE_NAMES = { refresh: "全流程", monitorKeywords: "监控巡检", collect: "取数",
  insight: "洞察", tag: "打标" };

const PRESETS = {
  square_nose: {
    type: "refresh",
    params: { category: "square_nose", categoryLabel: "Square Nose End Mills",
      labelXlsx: "/Users/haiyi/Desktop/Square Nose End Mills/Square_Nose_End_Mills_label.xlsx",
      tagJson: "/Users/haiyi/Desktop/Square Nose End Mills/sn_tag_full_20260911.json",
      pipelineOut: "/tmp/psa_ui_sn/out", workDir: "/tmp/psa_ui_sn", threadId: "ui-sn-" + Date.now() },
  },
  cutting_burrs: {
    type: "refresh",
    params: { category: "cutting_burrs", categoryLabel: "Cutting Burrs",
      labelXlsx: "/Users/haiyi/Desktop/Cutting Burrs/cutting burrs_label.xlsx",
      tagJson: "/Users/haiyi/Desktop/Cutting Burrs/cb_tag_full_20260914.json",
      pipelineOut: "/tmp/psa_ui_cb/out", workDir: "/tmp/psa_ui_cb", threadId: "ui-cb-" + Date.now() },
  },
  monitor: {
    type: "monitorKeywords",
    params: { source: "sif", keywords: ["carbide burr", "die grinder bits"], live: true,
      workDir: "/tmp/psa_ui_mon", threadId: "ui-mon-" + Date.now() },
  },
};

async function api(path, opts) {
  const r = await fetch(API + path, opts);
  return r.json();
}
function badge(s) {
  const cls = ["suspended","success","failed","error"].includes(s) ? s
    : ["pending","starting"].includes(s) ? "pending" : "";
  return `<span class="badge ${cls}">${s}</span>`;
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

async function refreshTasks() {
  const tasks = await api("/api/tasks");
  const box = document.getElementById("tasks");
  if (!tasks.length) { box.innerHTML = '<div class="empty">暂无任务</div>'; return; }
  box.innerHTML = tasks.map(t => `
    <div class="task-card ${t.id === curTask ? "active" : ""}" onclick="selectTask('${t.id}')">
      <div class="row1"><span class="type">${TYPE_NAMES[t.type] ?? t.type}</span>${badge(t.status)}</div>
      <div class="row2">${t.id} · ${new Date(t.createdAt).toLocaleTimeString()}
        ${t.params?.category ? " · " + esc(t.params.category) : ""}</div>
    </div>`).join("");
  if (curTask) await selectTask(curTask, true);
}

async function selectTask(id, silent) {
  curTask = id;
  const d = await api(`/api/tasks/${id}`);
  document.getElementById("detail-title").textContent = `任务详情 · ${id}`;
  document.getElementById("card-box").innerHTML = "";
  document.getElementById("report-box").innerHTML = "";
  const mins = Math.floor((d.elapsed ?? 0) / 60), secs = (d.elapsed ?? 0) % 60;
  const steps = d.steps ?? {};
  const stepNames = Object.keys(steps);
  const stepsHtml = stepNames.length ? `
    <div class="steps">${stepNames.map(k => {
      const st = steps[k].status ?? "pending";
      return `<div class="step ${st}"><span class="sdot"></span>
        <span class="sname">${esc(k)}</span><span class="sstatus">${esc(st)}</span></div>`;
    }).join("")}</div>` : '<div class="empty">步骤执行中…</div>';
  const progressHtml = (d.progress ?? []).length ? `
    <div class="plog"><h3>📋 实时进度（耗时 ${mins}分${secs}秒）</h3>${d.progress.map(p =>
      `<div class="pline">${esc(p)}</div>`).join("")}</div>`
    : `<div class="plog"><h3>📋 实时进度（耗时 ${mins}分${secs}秒）</h3><div class="empty">等待输出…</div></div>`;
  document.getElementById("steps-box").innerHTML = stepsHtml + progressHtml;
  const sp = d.suspendPayload;
  if (d.suspendedStep && sp) {
    const opts = sp.options ?? [];
    document.getElementById("card-box").innerHTML = `
      <div class="cardbox">
        <div class="ctitle">⏸ 需要你拍板：${esc(sp.title ?? "")}</div>
        <div class="cdetail">${esc(sp.detail ?? "")}</div>
        <div class="opts">${opts.map(o => `
          <button class="optbtn ${o.includes("（") && (o.includes("推荐") || o.includes("continue")) ? "primary" : ""}"
            onclick="decide('${id}', '${esc(o.split("（")[0].trim())}')">${esc(o)}</button>`).join("")}
          <button class="optbtn" onclick="decideCustom('${id}')">✍️ 自定义 JSON 拍板</button>
        </div>
      </div>`;
  }
  if (d.status === "success") {
    document.getElementById("report-box").innerHTML =
      `<h2 style="margin-top:20px">📊 报告</h2>
       <iframe class="report-frame" src="/api/tasks/${id}/report"></iframe>`;
  }
  if (!silent) refreshTasks();
}

async function decide(id, choice) {
  const mapping = { "continue": "continue", "cancel": "cancel", "skip": "skip",
    "singularity": "singularity", "mi": "mi", "both": "both", "不修数": { mode: "none" } };
  const decision = mapping[choice] ?? choice;
  await api(`/api/tasks/${id}/resume`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision }),
  });
  await selectTask(id);
}
async function decideCustom(id) {
  const raw = prompt("输入 JSON 拍板（如 {\"mode\":\"anchor\",\"anchor_brand\":\"LU&MN\",\"anchor_revenue\":455347.81}）:");
  if (raw == null) return;
  try {
    const decision = JSON.parse(raw);
    await api(`/api/tasks/${id}/resume`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ decision }),
    });
    await selectTask(id);
  } catch { alert("JSON 解析失败"); }
}

function initPreset() {
  const box = document.getElementById("preset");
  box.innerHTML = Object.keys(PRESETS).map(k =>
    `<button type="button" onclick="applyPreset('${k}')">${k}</button>`).join("");
}
function applyPreset(k) {
  const p = PRESETS[k];
  document.getElementById("f-type").value = p.type;
  document.getElementById("f-params").value = JSON.stringify(p.params, null, 2);
}

document.getElementById("newtask").addEventListener("submit", async (e) => {
  e.preventDefault();
  let params;
  try { params = JSON.parse(document.getElementById("f-params").value); }
  catch { alert("参数 JSON 解析失败"); return; }
  const type = document.getElementById("f-type").value;
  const r = await api("/api/tasks", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ type, params }),
  });
  if (r.error) { alert("⚠️ " + r.error); return; }
  curTask = r.id;
  await refreshTasks();
});

async function health() {
  try {
    await api("/api/health");
    document.getElementById("hdot").className = "dot";
    document.getElementById("htext").textContent = "服务在线";
  } catch {
    document.getElementById("hdot").className = "dot off";
    document.getElementById("htext").textContent = "服务离线";
  }
}

initPreset();
health();
refreshTasks();
timer = setInterval(refreshTasks, 3000);
</script>
</body>
</html>
