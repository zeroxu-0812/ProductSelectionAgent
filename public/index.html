<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选品 Agent · 对话工作台</title>
<style>
:root {
  --bg: #0a0e14; --panel: #10151f; --border: rgba(120,140,180,.14);
  --txt: #e8edf5; --sub: #8b98ad; --faint: #5d6a80;
  --accent: #5b9dff; --ok: #3ddc84; --warn: #ffb454; --err: #ff6b6b; --susp: #b48cff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--txt); font-family: -apple-system, "PingFang SC", sans-serif;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-thumb { background: rgba(120,140,180,.25); border-radius: 4px; }

/* 顶栏 */
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); background: var(--panel); z-index: 10; }
.topbar .logo { width: 32px; height: 32px; border-radius: 9px; font-size: 16px;
  background: linear-gradient(120deg, #1a2540, #221a3a); display: flex; align-items: center; justify-content: center; }
.topbar h1 { font-size: 15px; letter-spacing: .4px; }
.topbar .sub { font-size: 11.5px; color: var(--sub); }
.topbar .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.off { background: var(--err); }
.topbar .htext { font-size: 12px; color: var(--sub); }
.topbar .newchat { font-size: 12px; padding: 6px 14px; border-radius: 18px; border: 1px solid var(--border);
  background: transparent; color: var(--sub); cursor: pointer; transition: all .15s; }
.topbar .newchat:hover { color: var(--accent); border-color: var(--accent); }

/* 消息流 */
#chat { flex: 1; overflow-y: auto; padding: 26px 0 10px; scroll-behavior: smooth; }
.chat-inner { max-width: 820px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 18px; }
.msg { display: flex; gap: 10px; animation: fadein .25s; }
@keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }
.msg .avatar { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; font-size: 15px;
  display: flex; align-items: center; justify-content: center; }
.msg.user .avatar { background: linear-gradient(120deg, #1a2540, #2a1a3a); }
.msg.agent .avatar { background: linear-gradient(120deg, #0e2a1e, #122a3a); }
.msg .bubble { max-width: 82%; font-size: 13.5px; line-height: 1.65; }
.msg.user { flex-direction: row-reverse; }
.msg.user .bubble { background: linear-gradient(120deg, #1d2a44, #241a3a); padding: 10px 16px;
  border-radius: 14px 4px 14px 14px; }
.msg.agent .bubble { color: var(--txt); }
.msg.agent .bubble .meta { font-size: 11px; color: var(--faint); margin-bottom: 4px; }
/* agent 块状内容 */
.ablock { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px; margin-top: 6px; }
.ablock .atitle { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex;
  align-items: center; gap: 8px; }
.badge { font-size: 10px; padding: 2px 9px; border-radius: 12px; font-weight: 600; }
.badge.running { background: rgba(255,180,84,.1); color: var(--warn); }
.badge.suspended { background: rgba(180,140,255,.12); color: var(--susp); animation: breath 2s infinite; }
.badge.success { background: rgba(61,220,132,.1); color: var(--ok); }
.badge.error { background: rgba(255,107,107,.1); color: var(--err); }
@keyframes breath { 0%,100% { box-shadow: 0 0 0 0 rgba(180,140,255,.3); } 50% { box-shadow: 0 0 0 5px rgba(180,140,255,0); } }
/* 日志块 */
.logbox { font-family: ui-monospace, "SF Mono", monospace; font-size: 11.5px; color: #9fb0c8;
  line-height: 1.7; max-height: 220px; overflow-y: auto; margin-top: 8px;
  background: rgba(6,9,14,.6); border-radius: 10px; padding: 10px 12px; }
.logbox .ln { white-space: pre-wrap; word-break: break-all; border-bottom: 1px dashed rgba(120,140,180,.06); padding: 1px 0; }
.logbox .ln:last-child { border-bottom: none; }
/* 卡点 */
.cardbox { border: 1px solid rgba(180,140,255,.45); border-radius: 14px;
  background: linear-gradient(135deg, rgba(180,140,255,.08), rgba(20,16,34,.8));
  padding: 16px; margin-top: 8px; }
.cardbox .ctitle { font-size: 13.5px; font-weight: 700; color: #d9c6ff; display: flex;
  gap: 8px; align-items: center; margin-bottom: 8px; }
.cardbox .cpulse { width: 8px; height: 8px; border-radius: 50%; background: var(--susp); animation: breath 1.4s infinite; }
.cardbox .cdetail { font-size: 12.5px; color: var(--sub); line-height: 1.65; margin-bottom: 10px; white-space: pre-wrap; }
.cardbox .opts { display: flex; flex-wrap: wrap; gap: 7px; }
.optbtn { font-size: 12px; padding: 7px 13px; border-radius: 9px; border: 1px solid var(--border);
  background: rgba(10,14,22,.7); color: var(--txt); cursor: pointer; transition: all .15s; }
.optbtn:hover { border-color: var(--susp); background: rgba(180,140,255,.12); }
.cardbox .chathint { font-size: 11.5px; color: var(--faint); margin-top: 10px; }
/* 报告 */
.reportcard { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.reportcard a { font-size: 12.5px; padding: 9px 16px; border-radius: 10px; text-decoration: none;
  border: 1px solid rgba(91,157,255,.4); color: var(--accent); background: rgba(91,157,255,.07); transition: all .15s; }
.reportcard a:hover { background: rgba(91,157,255,.15); }
/* 输入区 */
.inputwrap { border-top: 1px solid var(--border); background: var(--panel); padding: 14px 20px 16px; }
.inputinner { max-width: 820px; margin: 0 auto; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { font-size: 11.5px; padding: 5px 12px; border-radius: 16px; border: 1px solid var(--border);
  background: transparent; color: var(--sub); cursor: pointer; transition: all .15s; }
.chip:hover { color: var(--accent); border-color: var(--accent); }
.inputrow { display: flex; gap: 10px; align-items: flex-end; }
.inputrow textarea { flex: 1; resize: none; background: rgba(6,9,14,.7); border: 1px solid var(--border);
  color: var(--txt); border-radius: 14px; padding: 12px 15px; font-size: 13.5px; line-height: 1.5;
  max-height: 140px; font-family: inherit; transition: border-color .2s; }
.inputrow textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,157,255,.1); }
.inputrow .send { padding: 11px 20px; border-radius: 13px; border: none; cursor: pointer; font-size: 13.5px;
  font-weight: 700; color: #fff; background: linear-gradient(120deg, var(--accent), #8b6cff);
  transition: all .15s; }
.inputrow .send:hover { filter: brightness(1.12); }
.inputrow .send:disabled { opacity: .4; cursor: not-allowed; }
.typing { display: flex; gap: 4px; padding: 6px 0; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); animation: tp 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes tp { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
.welcome { text-align: center; color: var(--sub); padding: 60px 0 30px; }
.welcome .big { font-size: 34px; margin-bottom: 12px; }
.welcome h2 { font-size: 17px; color: var(--txt); margin-bottom: 8px; }
.welcome p { font-size: 12.5px; line-height: 1.8; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🛠️</div>
  <div>
    <h1>选品 Agent</h1>
    <div class="sub">对话式 · 五智能体集群 · 人在环拍板</div>
  </div>
  <div class="right">
    <span class="dot" id="hdot"></span><span class="htext" id="htext">检查中…</span>
    <button class="newchat" onclick="newChat()">＋ 新会话</button>
  </div>
</div>

<div id="chat"><div class="chat-inner" id="chat-inner">
  <div class="welcome">
    <div class="big">🛠️</div>
    <h2>直接说你要做什么，我来调用对应的 Agent</h2>
    <p>「分析 square_nose 类目」—— 全流程（打标+洞察+双报告）<br>
    「监控 carbide burr、die grinder bits」—— 关键词趋势巡检<br>
    「取数 Creatine」—— 卖家精灵月采（自动反查类目）<br>
    「打标 cutting_burrs」—— 增量打标</p>
  </div>
</div></div>

<div class="inputwrap"><div class="inputinner">
  <div class="chips">
    <button class="chip" onclick="setInput('分析 square_nose 类目')">🔍 分析 SN 类目</button>
    <button class="chip" onclick="setInput('监控 carbide burr')">📡 监控关键词</button>
    <button class="chip" onclick="setInput('取数 Hole Saws')">📥 取数</button>
  </div>
  <div class="inputrow">
    <textarea id="input" rows="1" placeholder="直接说人话：分析类目 / 监控关键词 / 取数 / 打标…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="send" id="send" onclick="send()">发送</button>
  </div>
</div></div>

<script>
const API = "";
let CATS = [];
let activeTask = null; // { id, type, msgId, logIds }
let pollTimer = null;

function esc(s) { return String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
async function api(path, opts) {
  const r = await fetch(API + path, opts);
  return r.json();
}
const chatEl = () => document.getElementById("chat-inner");

function addMsg(role, html, meta) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = `<div class="avatar">${role === "user" ? "🧑" : "🤖"}</div>
    <div class="bubble">${meta ? `<div class="meta">${meta}</div>` : ""}${html}</div>`;
  chatEl().appendChild(d);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  return d;
}
function addUserMsg(text) { addMsg("user", `<div style="white-space:pre-wrap">${esc(text)}</div>`); }
function typing() {
  const d = document.createElement("div");
  d.className = "msg agent";
  d.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl().appendChild(d);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  return d;
}
function addLogBox(msgId, title, badge) {
  const d = addMsg("agent", `
    <div class="ablock">
      <div class="atitle">${esc(title)} <span class="badge ${badge}">${badge === "running" ? "运行中" : badge === "suspended" ? "待拍板" : badge === "success" ? "已完成" : badge}</span></div>
      <div class="logbox" id="log-${msgId}"></div>
    </div>`, "Agent 执行流");
  return d;
}
function appendLog(msgId, line) {
  const box = document.getElementById("log-" + msgId);
  if (!box) return;
  const ln = document.createElement("div");
  ln.className = "ln";
  ln.textContent = line;
  box.appendChild(ln);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 40) box.removeChild(box.firstChild);
}

const STATUS_ZH = { suspended: "待拍板", success: "已完成", running: "运行中",
  pending: "排队中", starting: "启动中", failed: "失败", error: "出错" };
const TYPE_NAMES = { refresh: "全流程分析", monitorKeywords: "监控巡检", collect: "取数",
  insight: "洞察报告", tag: "打标" };

async function newChat() {
  activeTask = null;
  chatEl().innerHTML = `<div class="welcome"><div class="big">🛠️</div>
    <h2>新会话开始</h2><p>直接说你要做什么</p></div>`;
}

function setInput(t) { document.getElementById("input").value = t; document.getElementById("input").focus(); }

/** 类目名 → 匹配注册表（键或展示名） */
function matchCat(v) {
  if (!v) return null;
  const lower = v.toLowerCase();
  return CATS.find(c => c.key.toLowerCase() === lower || c.label.toLowerCase() === lower)
    ?? CATS.find(c => v.includes(c.key) || v.toLowerCase().includes(c.label.toLowerCase()))
    ?? null;
}

/** 组装全流程参数（注册表类目自动推导；新类目需 label 路径） */
function buildCategoryParams(v) {
  const c = matchCat(v);
  if (c) {
    const slug = c.key.replace(/_/g, "-");
    return {
      category: c.key, categoryLabel: c.label, labelXlsx: c.labelXlsx, tagJson: c.tagJson,
      pipelineOut: `/tmp/psa_${slug}/out`, workDir: `/tmp/psa_${slug}`, threadId: `chat-${slug}-${Date.now()}`,
    };
  }
  const slug = v.replace(/[^a-z0-9-]/gi, "-").toLowerCase();
  return {
    category: slug, categoryLabel: v, labelXlsx: "", tagJson: "",
    pipelineOut: `/tmp/psa_${slug}/out`, workDir: `/tmp/psa_${slug}`, threadId: `chat-${slug}-${Date.now()}`,
  };
}

/** 从意图文本提取类目名（去掉动作词） */
function extractCategory(text) {
  return text.replace(/分析|全流程|跑一下|跑一遍|研究|取数|采集|打标|标注|洞察|报告|奇点|市场洞察|一下|这个|该|类目|的|数据|帮我|请/g, "").trim();
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  addUserMsg(text);
  input.value = "";
  input.style.height = "auto";
  document.getElementById("send").disabled = true;

  const t = typing();
  try {
    // 1. 意图路由
    const intent = await api("/api/chat-intent", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }),
    });
    if (!intent.ok) {
      t.remove();
      addMsg("agent", `<div class="ablock">${esc(intent.reply ?? "没理解")}</div>`);
      return;
    }
    // 2. 组装参数 + 创建任务
    let type = intent.type, params;
    if (type === "refresh" || type === "insight" || type === "tag") {
      const catText = extractCategory(text);
      params = buildCategoryParams(catText || intent.params?.category || "");
      if (!params.category) { t.remove(); addMsg("agent", `<div class="ablock">请告诉我类目名（如「分析 square_nose」）</div>`); return; }
      if (!params.labelXlsx) {
        t.remove();
        addMsg("agent", `<div class="ablock">新类目「${esc(params.categoryLabel)}」需要打标标准 label.xlsx 路径，请直接发我文件路径：<br>例如 <code>label: /Users/haiyi/Desktop/Round Files/xxx_label.xlsx</code></div>`);
        return;
      }
    } else if (type === "monitorKeywords") {
      params = {
        source: "sif", keywords: intent.params?.keywords ?? [], live: true, withFunnel: true,
        workDir: "/tmp/psa_chat_mon", threadId: "chat-mon-" + Date.now(),
      };
    } else if (type === "collect") {
      const catText = extractCategory(text);
      const taskJson = { mode: "category_monthly", category: catText, months: "last24", min_units: 50 };
      params = { source: "sellersprite", taskJson: JSON.stringify(taskJson), live: false,
        workDir: `/tmp/psa_chat_col_${catText.replace(/[^a-z0-9]/gi, "").slice(0, 12).toLowerCase()}`, threadId: "chat-col-" + Date.now() };
    }
    // 3. 创建任务
    const r = await api("/api/tasks", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, params }),
    });
    if (r.error) {
      t.remove();
      addMsg("agent", `<div class="ablock">⚠️ ${esc(r.error)}</div>`);
      return;
    }
    t.remove();
    const msgId = "t" + Date.now();
    addMsg("agent", `<div class="ablock" id="meta-${msgId}">
      <div class="atitle">🔀 已路由到「${esc(TYPE_NAMES[type] ?? type)}」 <span class="badge running">运行中</span></div>
      <div class="logbox" id="log-${msgId}"></div></div>`, "任务 " + r.id);
    activeTask = { id: r.id, type, msgId };
    appendLog(msgId, `任务已创建: ${r.id}（${TYPE_NAMES[type]}）`);
    poll();
  } catch (e) {
    t.remove();
    addMsg("agent", `<div class="ablock">⚠️ 出错了: ${esc(String(e))}</div>`);
  } finally {
    document.getElementById("send").disabled = false;
  }
}

/** 轮询任务状态 → 更新执行流消息 */
async function poll() {
  if (pollTimer) clearInterval(pollTimer);
  let lastProgress = [];
  let lastStatus = "";
  pollTimer = setInterval(async () => {
    if (!activeTask) return;
    const d = await api(`/api/tasks/${activeTask.id}`);
    const msgId = activeTask.msgId;
    const prog = d.progress ?? [];
    for (const line of prog) {
      if (!lastProgress.includes(line)) {
        lastProgress.push(line);
        appendLog(msgId, line);
      }
    }
    const meta = document.getElementById("meta-" + msgId);
    // 状态徽标更新
    if (meta) {
      const badge = meta.querySelector(".badge");
      if (badge) {
        badge.className = "badge " + (d.status === "suspended" ? "suspended" : ["success"].includes(d.status) ? "success" : d.status === "failed" || String(d.status).startsWith("error") ? "error" : "running");
        badge.textContent = STATUS_ZH[d.status] ?? d.status;
      }
    }
    // 卡点 → 渲染拍板卡（若还没渲染过）
    if (d.status === "suspended" && d.suspendPayload && lastStatus !== "suspended") {
      renderCard(msgId, d);
    }
    lastStatus = d.status;
    // 完成 → 报告
    if (d.status === "success" && d.suspendStep !== undefined) {
      // 结束
    }
  }, 2500);
}

function renderCard(msgId, d) {
  const sp = d.suspendPayload ?? {};
  const box = document.getElementById("log-" + msgId);
  const card = document.createElement("div");
  card.className = "cardbox";
  card.id = "card-" + msgId;
  const opts = sp.options ?? [];
  card.innerHTML = `
    <div class="ctitle"><span class="cpulse"></span>需要你拍板 · ${esc(sp.title ?? "")}</div>
    <div class="cdetail">${esc(sp.detail ?? "")}</div>
    <div class="opts">${opts.map(o => `<button class="optbtn" onclick="decide('${msgId}','${esc(o.split("（")[0].trim())}')">${esc(o)}</button>`).join("")}</div>
    <div class="chathint">💬 或直接在下方输入框回复（如「两个都要」「不修数」「锚点 LU&MN 营收 144883.52」）</div>`;
  box.parentElement.after(card);
  card.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function decide(msgId, choice) {
  const mapping = { "continue": "continue", "cancel": "cancel", "skip": "skip",
    "singularity": "singularity", "mi": "mi", "both": "both", "不修数": { mode: "none" } };
  const decision = mapping[choice] ?? choice;
  await resumeWith(decision, msgId);
}

async function resumeWith(decision, msgId) {
  if (!activeTask) return;
  const r = await api(`/api/tasks/${activeTask.id}/resume`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision }),
  });
  if (r.error) { appendLog(msgId, "⚠️ 拍板失败: " + r.error); return; }
  appendLog(msgId, `✅ 已拍板: ${JSON.stringify(decision)}`);
  const card = document.getElementById("card-" + msgId);
  if (card) card.remove();
}

// 输入框：对话式拍板优先（若活跃任务有挂起卡，用户输入走拍板解析）
const inputEl = document.getElementById("input");
inputEl.addEventListener("keydown", async (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    // 活跃任务挂起中 → 优先当拍板
    if (activeTask) {
      const d = await api(`/api/tasks/${activeTask.id}`);
      if (d.status === "suspended" && d.suspendPayload) {
        addUserMsg(text);
        inputEl.value = "";
        const title = d.suspendPayload.title ?? "";
        const parsed = await api("/api/parse-decision", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cardTitle: title, text }),
        });
        if (!parsed.ok) {
          addMsg("agent", `<div class="ablock">⚠️ 没听懂: ${esc(parsed.reason)}<br>试试「不修数」/「两个都要」/「锚点 LU&MN 营收 144883.52」</div>`);
          return;
        }
        addMsg("agent", `<div class="ablock">✅ 已理解 → <code style="font-size:11.5px;color:var(--ok)">${esc(JSON.stringify(parsed.decision))}</code>（${esc(parsed.reason)}），提交中…</div>`);
        await resumeWith(parsed.decision, activeTask.msgId);
        return;
      }
    }
    send();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});

async function health() {
  try {
    await api("/api/health");
    document.getElementById("hdot").className = "dot";
    document.getElementById("htext").textContent = "在线";
  } catch {
    document.getElementById("hdot").className = "dot off";
    document.getElementById("htext").textContent = "离线";
  }
  // 类目建议缓存
  try {
    const p = await api("/api/presets");
    CATS = p.categories ?? [];
  } catch {}
}

health();
</script>
</body>
</html>
