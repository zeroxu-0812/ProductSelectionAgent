<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选品 Agent · 对话工作台</title>
<style>
:root {
  --bg: #0a0e14; --panel: #10151f; --border: rgba(120,140,180,.14);
  --txt: #e8edf5; --sub: #8b98ad; --faint: #5d6a80;
  --accent: #5b9dff; --ok: #3ddc84; --warn: #ffb454; --err: #ff6b6b; --susp: #b48cff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--txt); font-family: -apple-system, "PingFang SC", sans-serif;
  height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-thumb { background: rgba(120,140,180,.25); border-radius: 4px; }

/* 顶栏 */
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  border-bottom: 1px solid var(--border); background: var(--panel); z-index: 10; }
.topbar .logo { width: 32px; height: 32px; border-radius: 9px; font-size: 16px;
  background: linear-gradient(120deg, #1a2540, #221a3a); display: flex; align-items: center; justify-content: center; }
.topbar h1 { font-size: 15px; letter-spacing: .4px; }
.topbar .sub { font-size: 11.5px; color: var(--sub); }
.topbar .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.off { background: var(--err); }
.topbar .htext { font-size: 12px; color: var(--sub); }
.topbar .newchat { font-size: 12px; padding: 6px 14px; border-radius: 18px; border: 1px solid var(--border);
  background: transparent; color: var(--sub); cursor: pointer; transition: all .15s; }
.topbar .newchat:hover { color: var(--accent); border-color: var(--accent); }

/* 消息流 */
#chat { flex: 1; overflow-y: auto; padding: 26px 0 10px; scroll-behavior: smooth; }
.chat-inner { max-width: 820px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 18px; }
.msg { display: flex; gap: 10px; animation: fadein .25s; }
@keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; } }
.msg .avatar { width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; font-size: 15px;
  display: flex; align-items: center; justify-content: center; }
.msg.user .avatar { background: linear-gradient(120deg, #1a2540, #2a1a3a); }
.msg.agent .avatar { background: linear-gradient(120deg, #0e2a1e, #122a3a); }
.msg .bubble { max-width: 82%; font-size: 13.5px; line-height: 1.65; }
.msg.user { flex-direction: row-reverse; }
.msg.user .bubble { background: linear-gradient(120deg, #1d2a44, #241a3a); padding: 10px 16px;
  border-radius: 14px 4px 14px 14px; }
.msg.agent .bubble { color: var(--txt); }
.msg.agent .bubble .meta { font-size: 11px; color: var(--faint); margin-bottom: 4px; }
/* agent 块状内容 */
.ablock { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 16px; margin-top: 6px; }
.ablock .atitle { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex;
  align-items: center; gap: 8px; }
.badge { font-size: 10px; padding: 2px 9px; border-radius: 12px; font-weight: 600; }
.badge.running { background: rgba(255,180,84,.1); color: var(--warn); }
.badge.suspended { background: rgba(180,140,255,.12); color: var(--susp); animation: breath 2s infinite; }
.badge.success { background: rgba(61,220,132,.1); color: var(--ok); }
.badge.error { background: rgba(255,107,107,.1); color: var(--err); }
@keyframes breath { 0%,100% { box-shadow: 0 0 0 0 rgba(180,140,255,.3); } 50% { box-shadow: 0 0 0 5px rgba(180,140,255,0); } }
/* 日志块 */
.logbox { font-family: ui-monospace, "SF Mono", monospace; font-size: 11.5px; color: #9fb0c8;
  line-height: 1.7; max-height: 220px; overflow-y: auto; margin-top: 8px;
  background: rgba(6,9,14,.6); border-radius: 10px; padding: 10px 12px; }
.logbox .ln { white-space: pre-wrap; word-break: break-all; border-bottom: 1px dashed rgba(120,140,180,.06); padding: 1px 0; }
.logbox .ln:last-child { border-bottom: none; }
/* 卡点 */
.cardbox { border: 1px solid rgba(180,140,255,.45); border-radius: 14px;
  background: linear-gradient(135deg, rgba(180,140,255,.08), rgba(20,16,34,.8));
  padding: 16px; margin-top: 8px; }
.cardbox .ctitle { font-size: 13.5px; font-weight: 700; color: #d9c6ff; display: flex;
  gap: 8px; align-items: center; margin-bottom: 8px; }
.cardbox .cpulse { width: 8px; height: 8px; border-radius: 50%; background: var(--susp); animation: breath 1.4s infinite; }
.cardbox .cdetail { font-size: 12.5px; color: var(--sub); line-height: 1.65; margin-bottom: 10px; white-space: pre-wrap; }
.cardbox .opts { display: flex; flex-wrap: wrap; gap: 7px; }
.optbtn { font-size: 12px; padding: 7px 13px; border-radius: 9px; border: 1px solid var(--border);
  background: rgba(10,14,22,.7); color: var(--txt); cursor: pointer; transition: all .15s; }
.optbtn:hover { border-color: var(--susp); background: rgba(180,140,255,.12); }
.cardbox .chathint { font-size: 11.5px; color: var(--faint); margin-top: 10px; }
.kv { display: flex; gap: 10px; font-size: 12.5px; padding: 4px 0;
  border-bottom: 1px dashed rgba(120,140,180,.08); }
.kv:last-child { border-bottom: none; }
.kv .k { color: #9fb0c8; min-width: 88px; flex-shrink: 0; }
.kv .v { color: var(--txt); word-break: break-all; }
.hl { color: var(--warn); font-weight: 600; }
/* 报告 */
.reportcard { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
.reportcard a { font-size: 12.5px; padding: 9px 16px; border-radius: 10px; text-decoration: none;
  border: 1px solid rgba(91,157,255,.4); color: var(--accent); background: rgba(91,157,255,.07); transition: all .15s; }
.reportcard a:hover { background: rgba(91,157,255,.15); }
/* 输入区 */
.inputwrap { border-top: 1px solid var(--border); background: var(--panel); padding: 14px 20px 16px; }
.inputinner { max-width: 820px; margin: 0 auto; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { font-size: 11.5px; padding: 5px 12px; border-radius: 16px; border: 1px solid var(--border);
  background: transparent; color: var(--sub); cursor: pointer; transition: all .15s; }
.chip:hover { color: var(--accent); border-color: var(--accent); }
.inputrow { display: flex; gap: 10px; align-items: flex-end; }
.inputrow textarea { flex: 1; resize: none; background: rgba(6,9,14,.7); border: 1px solid var(--border);
  color: var(--txt); border-radius: 14px; padding: 12px 15px; font-size: 13.5px; line-height: 1.5;
  max-height: 140px; font-family: inherit; transition: border-color .2s; }
.inputrow textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,157,255,.1); }
.inputrow .send { padding: 11px 20px; border-radius: 13px; border: none; cursor: pointer; font-size: 13.5px;
  font-weight: 700; color: #fff; background: linear-gradient(120deg, var(--accent), #8b6cff);
  transition: all .15s; }
.inputrow .send:hover { filter: brightness(1.12); }
.inputrow .send:disabled { opacity: .4; cursor: not-allowed; }
.typing { display: flex; gap: 4px; padding: 6px 0; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--sub); animation: tp 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes tp { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
.welcome { text-align: center; color: var(--sub); padding: 60px 0 30px; }
.welcome .big { font-size: 34px; margin-bottom: 12px; }
.welcome h2 { font-size: 17px; color: var(--txt); margin-bottom: 8px; }
.welcome p { font-size: 12.5px; line-height: 1.8; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">🛠️</div>
  <div>
    <h1>选品 Agent</h1>
    <div class="sub">对话式工作台</div>
  </div>
  <div class="right">
    <span class="dot" id="hdot"></span><span class="htext" id="htext">检查中…</span>
    <button class="newchat" onclick="newChat()">＋ 新会话</button>
  </div>
</div>

<div id="chat"><div class="chat-inner" id="chat-inner"></div></div>

<div class="inputwrap"><div class="inputinner">
  <div class="chips">
    <button class="chip" onclick="setInput('分析 square_nose 类目')">🔍 分析 SN 类目</button>
    <button class="chip" onclick="setInput('监控 carbide burr')">📡 监控关键词</button>
    <button class="chip" onclick="setInput('取数 Hole Saws')">📥 取数</button>
  </div>
  <div class="inputrow">
    <textarea id="input" rows="1" placeholder=""></textarea>
    <button class="send" id="send" onclick="send()">发送</button>
  </div>
</div></div>

<script>
const API = "";
let CATS = [];
let activeTask = null; // { id, type, msgId, logIds }
let pollTimer = null;
const CHAT_HISTORY = []; // 对话历史（多轮上下文）

function esc(s) { return String(s ?? "").replace(/[&<>"]/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
async function api(path, opts) {
  const r = await fetch(API + path, opts);
  return r.json();
}
const chatEl = () => document.getElementById("chat-inner");

function addMsg(role, html, meta) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.innerHTML = `<div class="avatar">${role === "user" ? "🧑" : "🤖"}</div>
    <div class="bubble">${meta ? `<div class="meta">${meta}</div>` : ""}${html}</div>`;
  chatEl().appendChild(d);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  return d;
}
function addUserMsg(text) { addMsg("user", `<div style="white-space:pre-wrap">${esc(text)}</div>`); }
function typing() {
  const d = document.createElement("div");
  d.className = "msg agent";
  d.innerHTML = `<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chatEl().appendChild(d);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  return d;
}
function addLogBox(msgId, title, badge) {
  const d = addMsg("agent", `
    <div class="ablock">
      <div class="atitle">${esc(title)} <span class="badge ${badge}">${badge === "running" ? "运行中" : badge === "suspended" ? "待拍板" : badge === "success" ? "已完成" : badge}</span></div>
      <div class="logbox" id="log-${msgId}"></div>
    </div>`, "Agent 执行流");
  return d;
}
function appendLog(msgId, line) {
  const box = document.getElementById("log-" + msgId);
  if (!box) return;
  const ln = document.createElement("div");
  ln.className = "ln";
  ln.textContent = line;
  box.appendChild(ln);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 40) box.removeChild(box.firstChild);
}

const STATUS_ZH = { suspended: "待拍板", success: "已完成", running: "运行中",
  pending: "排队中", starting: "启动中", failed: "失败", error: "出错" };
const TYPE_NAMES = { refresh: "全流程分析", monitorKeywords: "监控巡检", collect: "取数",
  insight: "洞察报告", tag: "打标" };

async function newChat() {
  activeTask = null;
  chatEl().innerHTML = "";
}

function setInput(t) { document.getElementById("input").value = t; document.getElementById("input").focus(); }

/** 类目名 → 匹配注册表（键或展示名） */
function matchCat(v) {
  if (!v) return null;
  const lower = v.toLowerCase();
  return CATS.find(c => c.key.toLowerCase() === lower || c.label.toLowerCase() === lower)
    ?? CATS.find(c => v.includes(c.key) || v.toLowerCase().includes(c.label.toLowerCase()))
    ?? null;
}

/** 组装全流程参数（注册表类目自动推导；新类目需 label 路径） */
function buildCategoryParams(v) {
  const c = matchCat(v);
  if (c) {
    const slug = c.key.replace(/_/g, "-");
    return {
      category: c.key, categoryLabel: c.label, labelXlsx: c.labelXlsx, tagJson: c.tagJson,
      pipelineOut: `/tmp/psa_${slug}/out`, workDir: `/tmp/psa_${slug}`, threadId: `chat-${slug}-${Date.now()}`,
    };
  }
  const slug = v.replace(/[^a-z0-9-]/gi, "-").toLowerCase();
  return {
    category: slug, categoryLabel: v, labelXlsx: "", tagJson: "",
    pipelineOut: `/tmp/psa_${slug}/out`, workDir: `/tmp/psa_${slug}`, threadId: `chat-${slug}-${Date.now()}`,
  };
}

/** 从意图文本提取类目名（去掉动作词） */
function extractCategory(text) {
  return text.replace(/输出|分析|全流程|跑一下|跑一遍|研究|取数|采集|打标|标注|洞察|报告|奇点|市场洞察|一下|这个|该|类目|的|数据|帮我|请/g, "").trim();
}

/** 新类目冷启动流（927 管道: prepare→套装三闸门→extract→维度确认→行业三闸门→confirm→bridge→全流程） */
let CS = null; // 冷启动状态机 {stage, msgId, params, type, cat, setRules}

async function coldstartFlow(msgId, params, type) {
  const cat = params.categoryLabel;
  CS = { stage: "running", msgId, params, type, cat };
  const box = addMsg("agent", `<div class="ablock" id="cs-${msgId}">
    <div class="atitle">🧬 新类目冷启动 <span class="badge running" id="csbadge-${msgId}">运行中</span></div>
    <div class="logbox" id="cslog-${msgId}"></div></div>`, "927 管道");
  const log = (s) => {
    const b = document.getElementById("cslog-" + msgId);
    if (!b) return;
    const ln = document.createElement("div");
    ln.className = "ln";
    ln.textContent = s;
    b.appendChild(ln);
    b.scrollTop = b.scrollHeight;
  };

  // ① RDS 头部详情
  log("① RDS 拉类目头部 ASIN 详情…");
  const prep = await api("/api/coldstart", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action: "prepare", category: cat }),
  });
  if (prep.error) { log("⚠️ " + prep.error); CS = null; return; }
  if (!prep.n) {
    // 库里无该类目数据 → 引导取数（不继续提维）
    document.getElementById("csbadge-" + msgId).className = "badge error";
    document.getElementById("csbadge-" + msgId).textContent = "需取数";
    log("⚠️ 数据库无「" + cat + "」类目数据（0 个 ASIN），无法提维打标。");
    log("请先回复「取数 " + cat + "」（卖家精灵自动反查+月采），取数完成后再跑分析。");
    CS = null;
    return;
  }
  log(`   RDS 头部 ${prep.n} 个 ASIN 就绪`);

  // 已注册类目（有 label 但无打标成品）→ 快通道: 沿用权威 label，不重新提维
  if (params.labelXlsx) {
    log("已注册类目 · label 体系已定 → 快通道（沿用 label 打标，不重新提维）…");
    const r = await api("/api/coldstart", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "fromlabel", category: cat, labelXlsx: params.labelXlsx }),
    });
    if (!r.ok) { log("⚠️ " + (r.error ?? "label 转换失败")); CS = null; return; }
    log(`   label 体系载入 ${r.n_dims} 维 ✓（来源 v2_label_xlsx）`);
    await csHandle("tag", "");
    return;
  }

  // 1.5 套装判断闸门①: 市场是否有套装形式出售
  CS.stage = "setq1";
  csCard(msgId, "套装判断闸门①", `类目「${esc(cat)}」在市场上有套装形式出售吗？<br>（如套装钻头 set / 多支装 pack / 组合 kit）`, [
    ["有", "setq2"], ["无（跳过套装判断）", "setSkip"], ["跳过", "setSkip"],
  ]);
}

/** 冷启动闸门卡（弹出时 badge 切「待拍板」） */
function csCard(msgId, title, detail, buttons) {
  const badge = document.getElementById("csbadge-" + msgId);
  if (badge) { badge.className = "badge suspended"; badge.textContent = "待拍板"; }
  const card = document.createElement("div");
  card.className = "cardbox";
  card.id = "cscard-" + msgId;
  card.innerHTML = `
    <div class="ctitle"><span class="cpulse"></span>${esc(title)}</div>
    <div class="cdetail">${detail}</div>
    <div class="opts">${buttons.map(([label, next]) =>
      `<button class="optbtn" onclick="csNext('${next}','${label}')">${label}</button>`).join("")}</div>
    <div class="chathint">💬 或直接输入框回复</div>`;
  const anchor = document.getElementById("cs-" + msgId);
  anchor.after(card);
  card.scrollIntoView({ behavior: "smooth", block: "center" });
}

function csLog(s) {
  const b = document.getElementById("cslog-" + CS.msgId);
  if (!b) return;
  const ln = document.createElement("div");
  ln.className = "ln";
  ln.textContent = s;
  b.appendChild(ln);
  b.scrollTop = b.scrollHeight;
}

async function csNext(next, label) {
  document.getElementById("cscard-" + CS.msgId)?.remove();
  const badge = document.getElementById("csbadge-" + CS.msgId);
  if (badge) { badge.className = "badge running"; badge.textContent = "运行中"; }
  if (label && next !== "send") csLog(`  ← ${label}`);
  await csHandle(next, "");
}

/** 冷启动状态机分发 */
async function csHandle(next, text) {
  const { msgId, params, type, cat } = CS;
  // 套装闸门①: 有 → 问区分规则
  if (next === "setq2") {
    CS.stage = "setq2";
    csCard(msgId, "套装判断闸门②", "用什么标准区分一个 ASIN 是套装？<br>如：标题含 set/pack/kit/pcs 且数量≥2，或子体数>1", [
      ["默认规则（set/pack/kit/pcs + 数量≥2）", "setRun"], ["跳过", "setSkip"],
    ]);
    return;
  }
  if (next === "setRun") {
    CS.stage = "running";
    csLog("  双通道套装判断（用户规则 + LLM 制衡）…");
    CS.setRules = { set_keywords: ["set", "pack", "kit", "pcs", "piece"], single_keywords: ["single", "1 pc", "each"], min_pcs: 2 };
    const r = await api("/api/coldstart", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "setdetect", category: cat, rules: CS.setRules }),
    });
    if (r.error) { csLog("⚠️ " + r.error); CS = null; return; }
    csLog(`   套装 ${r.n_set} / 单件 ${r.n_single} / 存疑 ${(r.uncertain ?? []).length}`);
    if ((r.uncertain ?? []).length) {
      CS.stage = "setq3";
      const list = r.uncertain.map(u =>
        `<div style="font-size:11.5px;margin:3px 0">· ${esc(u.asin)} ${esc((u.title ?? "").slice(0, 60))} — <a href="https://www.amazon.com/dp/${esc(u.asin)}" target="_blank">前台看</a></div>`).join("");
      csCard(msgId, "套装判断闸门③", `存疑清单（规则与 LLM 冲突/低置信，请人工判）：<br>${list}<br>可回复「跳过」按现状继续，或逐个判定（如「B0XX=套装 B0YY=单件」）`, [
        ["跳过（按现状）", "setFinal"], ["全部视为套装", "setAll"], ["全部视为单件", "setNone"],
      ]);
    } else {
      await csHandle("setFinal", "");
    }
    return;
  }
  if (next === "setFinal" || next === "setAll" || next === "setNone") {
    if (next === "setAll" || next === "setNone") {
      const r0 = await api(`/api/tasks`); // 无任务——直接构造 manual：从 uncertain 全判
      csLog(`  （${next === "setAll" ? "全部视为套装" : "全部视为单件"}——简化处理）`);
    }
    const r = await api("/api/coldstart", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "setfinal", category: cat, rules: CS.setRules ?? {} }),
    });
    if (!r.ok) { csLog("⚠️ " + (r.error ?? "套装定稿失败")); }
    else csLog("  套装判断定稿 ✓（label 追加「售卖形式」维）");
    await csHandle("extract", "");
    return;
  }
  // 无套装（setSkip）→ 不进套装判断，直接提维
  if (next === "setSkip") {
    await csHandle("extract", "");
    return;
  }
  if (next === "extract") {
    CS.stage = "running";
    csLog("② LLM 抽象奇点维度（≥5 维，基于头部 listing）…");
    const ext = await api("/api/coldstart", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "extract", category: cat }),
    });
    if (ext.error) { csLog("⚠️ " + ext.error); CS = null; return; }
    const dims = ext.dimensions ?? [];
    csLog(`   提取 ${dims.length} 个维度 ✓`);
    CS.stage = "dims";
    const dimHtml = dims.map(d =>
      `<div style="margin:3px 0"><b>${esc(d.name_zh)}</b> (${esc(d.name_en)}) · ${esc(d.type)}
        ${(d.values ?? []).length ? `· 取值 ${d.values.length} 个` : ""}</div>`).join("");
    csCard(msgId, "维度确认闸门", `LLM 提取的奇点维度（维度定错后面全错）：<br>${dimHtml}<br>💬 回复「确认」或补充（如「加一个维度：刀柄材质，取值 木柄/塑料柄」）`, [
      ["确认", "dimsOK"], ["跳过行业学习直接打标", "dimsSkipInd"],
    ]);
    return;
  }
  if (next === "dimsOK" || next === "dimsSkipInd") {
    if (next === "dimsSkipInd") { csLog("  （跳过行业学习）"); await csHandle("tag", ""); return; }
    CS.stage = "running";
    csLog("②b 行业专业资料学习: 搜索 3 个行业网站…");
    const r = await api("/api/coldstart", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "industry-discover", category: cat }),
    });
    if (r.error) { csLog("⚠️ 行业学习失败，跳过: " + r.error); await csHandle("tag", ""); return; }
    CS.stage = "ind1";
    const list = (r.candidates ?? []).map(c =>
      `<div style="font-size:11.5px;margin:3px 0">· ${esc(c.name)} — ${esc(c.url ?? "")}</div>`).join("");
    csCard(msgId, "行业学习闸门①", `候选行业网站（判断是否可用，URL 请自行核查）：<br>${list || "（无候选）"}`, [
      ["可用（全部确认）", "indOK"], ["跳过行业学习", "tag"],
    ]);
    return;
  }
  if (next === "indOK") {
    CS.stage = "running";
    csLog("  抓取学习 + 与已确认维度交叉…");
    const r = await api("/api/coldstart", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "industry-crosscheck", category: cat, approvedSources: [] }),
    });
    if (r.error) { csLog("⚠️ " + r.error); await csHandle("tag", ""); return; }
    csLog("  建议补充规则已生成（只补充禁修改已定规则）");
    const r2 = await api("/api/coldstart", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "industry-finalize", category: cat }),
    });
    csLog(r2.ok ? "  行业规则定稿 ✓（category_rules.json 注入打标）" : "⚠️ 定稿失败，跳过");
    await csHandle("tag", "");
    return;
  }
  if (next === "tag") {
    CS.stage = "running";
    csLog("③ 四层分层打标（L1→L4 缺啥补啥，注入行业规则）…");
    const conf = await api("/api/coldstart", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "confirm", category: cat, supplements: [] }),
    });
    if (conf.error) { csLog("⚠️ " + conf.error); CS = null; return; }
    csLog(`   打标完成: ${conf.n_asins} ASIN / ${conf.n_tagged_values} 个标签值`);
    csLog("④ 标准化 → ⑤ 桥接 V2 格式…");
    const br = await api("/api/coldstart", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "bridge", category: cat }),
    });
    if (br.error) { csLog("⚠️ " + br.error); CS = null; return; }
    csLog(`   桥接完成: tag_full ${br.n_asins} ASIN ✓`);
    const badge = document.getElementById("csbadge-" + msgId);
    if (badge) { badge.className = "badge success"; badge.textContent = "已完成"; }
    CS = null;
    // 继续全流程
    params.labelXlsx = br.label_xlsx;
    params.tagJson = br.tag_full;
    const r = await api("/api/tasks", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, params }),
    });
    if (r.error) { csLog("⚠️ " + r.error); return; }
    activeTask = { id: r.id, type, msgId };
    addMsg("agent", `<div class="ablock" id="meta-${msgId}2">
      <div class="atitle">${esc(TYPE_NAMES[type] ?? type)} <span class="badge running">运行中</span></div>
      <div class="logbox" id="log-${msgId}"></div></div>`, "任务 " + r.id);
    appendLog(msgId, `任务已创建: ${r.id}（打标成品来自冷启动桥接）`);
    poll();
    return;
  }
}

/** 冷启动闸门自然语言回复分发（按 CS.stage） */
async function csConfirm(text) {
  if (!CS) return;
  const { msgId, cat } = CS;
  const stage = CS.stage;
  // 套装闸门①: 有/无
  if (stage === "setq1") {
    if (/^(有|是|yes|存在)/i.test(text)) { document.getElementById("cscard-" + msgId)?.remove(); await csHandle("setq2", text); }
    else if (/^(无|没|没有|no|跳过)/i.test(text)) { document.getElementById("cscard-" + msgId)?.remove(); csLog("  ← 无（跳过套装判断）"); await csHandle("setSkip", text); }
    else csLog("  （请回复「有」或「无」）");
    return;
  }
  // 套装闸门②: 自定义规则（简单解析关键词）或默认
  if (stage === "setq2") {
    if (/^(默认|跳过)/.test(text)) { document.getElementById("cscard-" + msgId)?.remove(); await csHandle("setRun", text); return; }
    const kws = text.split(/[，,、\s]+/).map(s => s.trim()).filter(Boolean);
    if (kws.length) {
      CS.setRules = { set_keywords: kws, single_keywords: ["single", "each"], min_pcs: 2 };
      csLog(`  ← 用户规则关键词: ${kws.join(", ")}`);
      document.getElementById("cscard-" + msgId)?.remove();
      await csHandle("setRun", text);
    }
    return;
  }
  // 套装闸门③: 逐个判定或跳过
  if (stage === "setq3") {
    if (/^(跳过|确认|ok)/i.test(text)) { document.getElementById("cscard-" + msgId)?.remove(); await csHandle("setFinal", text); return; }
    csLog("  （已记录判定——简化版请用按钮「跳过」或「全部视为X」）");
    return;
  }
  // 维度确认闸门: 确认/补充
  if (stage === "dims") {
    if (/^(确认|确定|ok|好|可以|没问题|yes)/i.test(text)) { document.getElementById("cscard-" + msgId)?.remove(); await csHandle("dimsOK", text); return; }
    // 补充解析
    const m = text.match(/(?:加|新增|补充).{0,6}维度[：:]\s*(.+?)(?:[，,]?\s*取值[：:]\s*(.+))?$/);
    if (m) {
      const dimName = m[1].trim();
      const values = (m[2] ?? "").split(/[\/、，,]/).map(s => s.trim()).filter(Boolean);
      csLog(`  已吸收补充维度「${dimName}」（取值 ${values.length} 个，留痕 user_supplements）`);
      const supp = [{
        kind: "new_dimension", dimension: dimName,
        payload: { name_zh: dimName, name_en: dimName, type: "single",
          values: values.map(v => ({ zh: v, en: v, keywords: [], priority: "" })) },
      }];
      await api("/api/coldstart", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "absorb", category: cat, supplements: supp }),
      }).catch(() => null);
    }
    document.getElementById("cscard-" + msgId)?.remove();
    await csHandle("dimsOK", text);
    return;
  }
  // 行业学习闸门①: 可用/跳过
  if (stage === "ind1") {
    if (/^(可用|确认|ok|好)/i.test(text)) { document.getElementById("cscard-" + msgId)?.remove(); await csHandle("indOK", text); return; }
    if (/^(跳过|不要|不用)/i.test(text)) { document.getElementById("cscard-" + msgId)?.remove(); await csHandle("tag", text); return; }
    csLog("  （请点按钮「可用」或「跳过行业学习」）");
    return;
  }
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;
  addUserMsg(text);
  input.value = "";
  input.style.height = "auto";
  document.getElementById("send").disabled = true;

  const t = typing();
  try {
    // 1. 自然语言对话层（多轮上下文 + 提问/任务分流）
    const chat = await api("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: CHAT_HISTORY.slice(-10).concat([{ role: "user", content: text }]) }),
    });
    if (!chat || chat.error) {
      t.remove();
      addMsg("agent", `<div class="ablock">⚠️ 对话层异常: ${esc(chat?.error ?? "无响应")}</div>`);
      return;
    }
    if (chat.kind === "answer") {
      t.remove();
      CHAT_HISTORY.push({ role: "user", content: text });
      CHAT_HISTORY.push({ role: "assistant", content: chat.text ?? "" });
      addMsg("agent", `<div class="ablock">${esc(chat.text ?? "")}</div>`);
      return;
    }
    // kind=task → 走任务流程（LLM 已提取结构化参数）
    if (chat.kind !== "task") {
      t.remove();
      addMsg("agent", `<div class="ablock">${esc(JSON.stringify(chat))}</div>`);
      return;
    }
    const intent = { ok: true, type: chat.type, params: chat.params ?? {}, reason: "对话层" };
    if (!intent.ok) {
      t.remove();
      addMsg("agent", `<div class="ablock">${esc(intent.reply ?? "没理解")}</div>`);
      return;
    }
    const msgId = "t" + Date.now(); // 提前生成：参数组装阶段的提示也进日志块
    // 2. 组装参数 + 创建任务
    let type = intent.type, params;
    if (type === "refresh" || type === "insight" || type === "tag") {
      const catText = intent.params?.category || extractCategory(text);
      params = buildCategoryParams(catText || intent.params?.category || "");
      if (!params.category) { t.remove(); addMsg("agent", `<div class="ablock">请告诉我类目名（如「分析 square_nose」）</div>`); return; }
      // 打标文件自动定位（洞察/全流程免人工输入打标路径）
      const check = await api("/api/check-category", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: params.categoryLabel || params.category }),
      }).catch(() => null);
      const tf = check?.tag_file ?? {};
      if (tf.exists && tf.path) {
        if (tf.source === "auto-probe") {
          params.tagJson = tf.path;
          window["_hint_" + msgId] = `已自动定位打标文件: ${tf.path}`;
        }
      }
      if (!params.labelXlsx || !(tf.exists || params.tagJson)) {
        // 无 label 或无打标成品 → 自动走冷启动（提维→确认→打标→桥接），不再要求人工上传
        t.remove();
        await coldstartFlow(msgId, params, type);
        return;
      }
    } else if (type === "monitorKeywords") {
      params = {
        source: "sif", keywords: intent.params?.keywords ?? [], live: true, withFunnel: true,
        workDir: "/tmp/psa_chat_mon", threadId: "chat-mon-" + Date.now(),
      };
      if (!params.keywords.length) {
        t.remove();
        addMsg("agent", `<div class="ablock">请告诉我要监控的关键词（如「监控 carbide burr、die grinder bits」）</div>`);
        return;
      }
    } else if (type === "collect") {
      const catText = extractCategory(text);
      const taskJson = { mode: "category_monthly", category: catText, months: "last24", min_units: 50 };
      params = { source: "sellersprite", taskJson: JSON.stringify(taskJson), live: false,
        workDir: `/tmp/psa_chat_col_${catText.replace(/[^a-z0-9]/gi, "").slice(0, 12).toLowerCase()}`, threadId: "chat-col-" + Date.now() };
    }
    // 3. 创建任务
    const r = await api("/api/tasks", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, params }),
    });
    if (r.error) {
      t.remove();
      addMsg("agent", `<div class="ablock">⚠️ ${esc(r.error)}</div>`);
      return;
    }
    // 记录对话历史（多轮指代）
    CHAT_HISTORY.push({ role: "user", content: text });
    CHAT_HISTORY.push({ role: "assistant", content: `已启动${TYPE_NAMES[type] ?? type}任务 ${r.id}` });
    t.remove();
    addMsg("agent", `<div class="ablock" id="meta-${msgId}">
      <div class="atitle">${esc(TYPE_NAMES[type] ?? type)} <span class="badge running">运行中</span></div>
      <div class="logbox" id="log-${msgId}"></div></div>`, "任务 " + r.id);
    activeTask = { id: r.id, type, msgId };
    appendLog(msgId, `任务已创建: ${r.id}`);
    // 打标文件自动定位提示（若有）
    if (window["_hint_" + msgId]) appendLog(msgId, window["_hint_" + msgId]);
    poll();
  } catch (e) {
    t.remove();
    addMsg("agent", `<div class="ablock">⚠️ 出错了: ${esc(String(e))}</div>`);
  } finally {
    document.getElementById("send").disabled = false;
  }
}

/** 轮询任务状态 → 更新执行流消息 */
async function poll() {
  if (pollTimer) clearInterval(pollTimer);
  let lastProgress = [];
  let lastStatus = "";
  pollTimer = setInterval(async () => {
    if (!activeTask) return;
    const d = await api(`/api/tasks/${activeTask.id}`);
    const msgId = activeTask.msgId;
    const prog = d.progress ?? [];
    for (const line of prog) {
      if (!lastProgress.includes(line)) {
        lastProgress.push(line);
        appendLog(msgId, line);
      }
    }
    const meta = document.getElementById("meta-" + msgId);
    // 状态徽标更新
    if (meta) {
      const badge = meta.querySelector(".badge");
      if (badge) {
        badge.className = "badge " + (d.status === "suspended" ? "suspended" : ["success"].includes(d.status) ? "success" : d.status === "failed" || String(d.status).startsWith("error") ? "error" : "running");
        badge.textContent = STATUS_ZH[d.status] ?? d.status;
      }
    }
    // 卡点 → 渲染拍板卡（若还没渲染过）
    if (d.status === "suspended" && d.suspendPayload && lastStatus !== "suspended") {
      renderCard(msgId, d);
    }
    lastStatus = d.status;
    // 完成 → 报告
    if (d.status === "success" && d.suspendStep !== undefined) {
      // 结束
    }
  }, 2500);
}

function renderCard(msgId, d) {
  const sp = d.suspendPayload ?? {};
  const box = document.getElementById("log-" + msgId);
  const card = document.createElement("div");
  card.className = "cardbox";
  card.id = "card-" + msgId;
  const opts = sp.options ?? [];
  // 按钮文案人话化（保留原始决策值）
  const optLabel = (o) => String(o)
    .replace(/^拍板 JSON（anchor\/coef\/none）$/, "对话拍板（说人话: 锚点/系数/不修数）")
    .replace(/^continue（/, "继续（")
    .replace(/^cancel（/, "取消（")
    .replace(/^skip（/, "跳过（");
  card.innerHTML = `
    <div class="ctitle"><span class="cpulse"></span>需要你拍板 · ${esc(sp.title ?? "")}</div>
    <div class="cdetail">${humanizeDetail(sp.detail ?? "")}</div>
    <div class="opts">${opts.map(o => `<button class="optbtn" onclick="decide('${msgId}','${esc(o.split("（")[0].trim())}')">${esc(optLabel(o))}</button>`).join("")}</div>
    <div class="chathint">💬 或直接在输入框回复（如「两个都要」「不修数」）</div>`;
  box.parentElement.after(card);
  card.scrollIntoView({ behavior: "smooth", block: "center" });
}

/** 拍板卡 detail 人话化: JSON/Python dict → 键值表格（中文说明），纯文本保留 */
const DICT_KEYS_ZH = {
  mode: "模式", mode_desc: "模式说明", source: "数据源", months: "月份范围",
  est_calls: "预估调用", n_calls_max: "最多调用", rate: "限速", est_minutes: "预估耗时",
  requires_auth: "需授权", category: "类目", task: "任务", detail: "详情",
};
function humanizeDetail(detail) {
  let s = String(detail ?? "");
  // 1. Python dict 字符串（单引号）→ 逐键提取
  const pyDict = /^\s*\{.*\}\s*$/.test(s) && s.includes("'");
  if (pyDict) {
    const kvs = [];
    const re = /'([^']+)'\s*:\s*(\[[^\]]*\]|\{[^}]*\}|'[^']*'|[^,{}]+)/g;
    let m;
    while ((m = re.exec(s)) !== null) {
      let v = m[2].trim().replace(/^'|'$/g, "");
      if (v.startsWith("[") && v.endsWith("]")) {
        try { v = JSON.parse(v.replace(/'/g, '"')).join(", "); } catch { /* keep */ }
      }
      kvs.push([DICT_KEYS_ZH[m[1]] ?? m[1], v]);
    }
    if (kvs.length) {
      return kvs.map(([k, v]) =>
        `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("");
    }
  }
  // 2. JSON 字符串 → 键值
  if (s.startsWith("{") || s.startsWith("[")) {
    try {
      const o = JSON.parse(s);
      const arr = Array.isArray(o) ? o : Object.entries(o);
      return arr.map(([k, v]) =>
        `<div class="kv"><span class="k">${esc(DICT_KEYS_ZH[k] ?? k)}</span><span class="v">${esc(typeof v === "object" ? JSON.stringify(v) : String(v))}</span></div>`).join("");
    } catch { /* fall through */ }
  }
  // 3. 修数卡 JSON 示例文本 → 分段美化（①②③ 结构保留）
  if (s.includes("anchor") && s.includes("mode")) {
    s = esc(s);
    s = s.replace(/（注册表推荐[^）]*）/, '<span class="hl">$&</span>');
    s = s.replace(/\\n/g, "<br>");
    return s.replace(/(\d\.\s)/g, "<br><b>$1</b>");
  }
  // 4. 纯文本（保留换行）
  return esc(s).replace(/\n/g, "<br>");
}

async function decide(msgId, choice) {
  const mapping = { "continue": "continue", "cancel": "cancel", "skip": "skip",
    "singularity": "singularity", "mi": "mi", "both": "both", "不修数": { mode: "none" } };
  const decision = mapping[choice] ?? choice;
  await resumeWith(decision, msgId);
}

async function resumeWith(decision, msgId) {
  if (!activeTask) return;
  const r = await api(`/api/tasks/${activeTask.id}/resume`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision }),
  });
  if (r.error) { appendLog(msgId, "⚠️ 拍板失败: " + r.error); return; }
  appendLog(msgId, `✅ 已拍板: ${JSON.stringify(decision)}`);
  const card = document.getElementById("card-" + msgId);
  if (card) card.remove();
}

// 输入框：对话式拍板优先（若活跃任务有挂起卡，用户输入走拍板解析）
const inputEl = document.getElementById("input");
inputEl.addEventListener("keydown", async (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    // 冷启动闸门挂起 → 回复走状态机
    if (CS) {
      addUserMsg(text);
      inputEl.value = "";
      await csConfirm(text);
      return;
    }
    // 活跃任务挂起中 → 优先当拍板
    if (activeTask) {
      const d = await api(`/api/tasks/${activeTask.id}`);
      if (d.status === "suspended" && d.suspendPayload) {
        addUserMsg(text);
        inputEl.value = "";
        const title = d.suspendPayload.title ?? "";
        const parsed = await api("/api/parse-decision", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cardTitle: title, text }),
        });
        if (!parsed.ok) {
          addMsg("agent", `<div class="ablock">⚠️ 没听懂: ${esc(parsed.reason)}<br>试试「不修数」/「两个都要」/「锚点 LU&MN 营收 144883.52」</div>`);
          return;
        }
        addMsg("agent", `<div class="ablock">✅ 已理解 → <code style="font-size:11.5px;color:var(--ok)">${esc(JSON.stringify(parsed.decision))}</code>（${esc(parsed.reason)}），提交中…</div>`);
        await resumeWith(parsed.decision, activeTask.msgId);
        return;
      }
    }
    send();
  }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});
